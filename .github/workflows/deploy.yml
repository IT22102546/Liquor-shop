name: CI / Deploy

# Every push and pull request to main is checked (install, type-check, build).
# Pushes to main (and manual runs) are then deployed to the server over SSH.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check (type-check & build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            pos/package-lock.json

      - name: Backend – install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend – type-check & build
        working-directory: backend
        run: |
          npx prisma generate
          npx tsc --noEmit -p .
          npm run build

      - name: Frontend – install
        working-directory: pos
        run: npm ci --no-audit --no-fund

      - name: Frontend – type-check & build
        working-directory: pos
        env:
          NEXT_PUBLIC_API_URL: https://api.pos.kodearcs.tech
        run: |
          npx tsc --noEmit -p .
          npm run build

  deploy:
    name: Deploy to production
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          # Update the code first, then run the (new) deploy script from it.
          script: |
            set -e
            cd ~/bar-shop
            git fetch --prune origin
            git checkout -q main
            git reset --hard origin/main
            bash scripts/deploy.sh main

      - name: Check the live sites
        run: |
          curl -fsS https://api.pos.kodearcs.tech/health
          curl -fsS -o /dev/null -w "pos.kodearcs.tech → %{http_code}\n" https://pos.kodearcs.tech/signin
